<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YAQUB UC SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050a1e;--topbg:rgba(5,10,30,.82);--card:#0d1740;--card2:#14215a;--line:rgba(64,118,255,.32);--text:#eef2ff;--muted:#8d9cca;--gold:#ffc83d;--gold2:#ff9a1f;--blue:#2f7bff;--green:#2fd27a;--red:#ff5d62;--gray:#8793b8;--ink:#1a1206;--shadow:0 8px 28px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#eef2fc;--topbg:rgba(238,242,252,.86);--card:#ffffff;--card2:#eaf0ff;--line:rgba(47,107,255,.28);--text:#0c1433;--muted:#5a6a96;--shadow:0 8px 24px rgba(30,60,140,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(90% 45% at 85% -8%,rgba(47,107,255,.38),transparent 62%),radial-gradient(70% 35% at 0% 100%,rgba(255,200,61,.10),transparent 60%)}
[data-theme=light] body::before{opacity:.4}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.ic{display:block;flex:none}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#app.no-tabs{padding-bottom:28px}
#app.no-tabs #tabs{display:none}

/* ===== Yuqori panel ===== */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--topbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 8px rgba(255,200,61,.35))}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;letter-spacing:.02em}
.brand small{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.ttl{flex:1;font-size:18px;font-weight:800}
.rb{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(80,120,255,.14);border:1px solid var(--line);transition:transform .2s,background .2s}
.rb:active{transform:scale(.88);background:rgba(80,120,255,.3)}

/* ===== Ekranlar ===== */
#view{padding:6px 14px 0}
.screen{animation:scrIn .38s cubic-bezier(.22,1,.36,1)}
@keyframes scrIn{from{opacity:0;transform:translateX(26px)}}
.sec{display:flex;align-items:center;gap:8px;margin:22px 2px 12px;font-size:16px;font-weight:800}
.sec span{font-size:18px}

/* ===== Banner ===== */
.hero{position:relative;overflow:hidden;min-height:178px;padding:18px 16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,#0d1d5c 0%,#0a1233 55%,#1b1233 100%);box-shadow:0 0 0 1px rgba(47,107,255,.14),0 0 38px rgba(47,107,255,.28)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 52%,rgba(255,200,61,.22) 52.4%,rgba(255,200,61,0) 72%)}
.hero::after{content:"";position:absolute;left:-30%;bottom:-60%;width:90%;height:120%;background:radial-gradient(circle,rgba(47,123,255,.35),transparent 65%)}
.hero-txt{position:relative;z-index:2;max-width:58%}
.tagp{display:inline-block;padding:4px 10px;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);font-size:12px;font-weight:900;letter-spacing:.06em;font-style:italic}
.hero h1{margin:12px 0 12px;font-size:20px;line-height:1.15;font-weight:900;font-style:italic;color:#fff;transform:skewX(-6deg);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.online{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em}
.online i{width:9px;height:9px;border-radius:50%;background:var(--gray)}
.online.on i{background:var(--green);box-shadow:0 0 0 0 rgba(47,210,122,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(47,210,122,0)}100%{box-shadow:0 0 0 0 rgba(47,210,122,0)}}
.hero-img{position:absolute;z-index:1;right:-6px;bottom:6px;width:42%;max-width:180px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.65));animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-1.5deg)}}
.spark{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8);opacity:0;animation:tw 3.2s infinite}
.s1{right:30%;top:22%}.s2{right:8%;top:14%;animation-delay:1.1s}.s3{right:20%;bottom:34%;animation-delay:2s}
@keyframes tw{40%,60%{opacity:1;transform:scale(1.4)}}

/* ===== Aksiya ===== */
.promo{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 14px;text-align:left;border-radius:16px;border:1px solid rgba(255,200,61,.5);background:linear-gradient(90deg,rgba(255,200,61,.2),rgba(255,154,31,.08));box-shadow:0 0 22px rgba(255,200,61,.14)}
.promo .gi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink)}
.promo b{display:block;color:var(--gold);font-size:15px}
.promo small{display:block;margin-top:2px;font-size:13px}
.promo>div{flex:1}

/* ===== Paketlar ===== */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 4px 10px;border-radius:16px;border:1.5px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;animation:rise .5s ease backwards;animation-delay:calc(var(--i) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.94)}}
.pk:active{transform:scale(.93)}
.pk.hot{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.16),var(--shadow)}
.pk img{width:var(--w);height:auto;margin:2px 0 6px;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
.pk b{font-size:19px;font-weight:900;line-height:1}
.pk small{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.pk .pr{margin-top:7px;padding:3px 9px;border-radius:14px;background:rgba(255,200,61,.14);color:var(--gold);font-size:12.5px;font-weight:800;white-space:nowrap}
.pk .pr s{color:var(--muted);font-weight:600;font-size:10px;margin-left:3px}
.flag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink)}

/* ===== Forma ===== */
.pkgcard{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid rgba(255,200,61,.5);background:linear-gradient(120deg,#2b2410 0%,var(--card2) 55%,var(--card) 100%);box-shadow:0 0 26px rgba(255,200,61,.14)}
.pkgcard img{width:112px;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.pkgcard .big{display:block;font-size:30px;font-weight:900;line-height:1.05}
.pkgcard .gold{display:block;margin-top:6px;color:var(--gold);font-size:19px;font-weight:800}
.pkgcard .gold s{color:var(--muted);font-size:13px;font-weight:600;margin-left:6px}
.pill{position:absolute;right:12px;bottom:12px;padding:4px 12px;border-radius:12px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);font-size:12px;font-weight:900}
.fld{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);transition:border-color .2s,box-shadow .2s}
.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.2)}
.fld.bad{border-color:var(--red);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fi{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(47,123,255,.16);color:#7fb0ff;font-size:20px}
.fb{flex:1;min-width:0}
.fb small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.fb input{width:100%;padding:2px 0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;font-weight:700}
.fb input::placeholder{color:var(--muted);font-weight:500}
.help{color:var(--muted);align-self:flex-start}
.warn{display:flex;gap:12px;margin:6px 0 18px;padding:14px;border-radius:16px;border:1px solid rgba(255,200,61,.55);background:rgba(255,200,61,.07);color:var(--gold)}
.warn b{display:block;font-size:15px}
.warn p{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--text);opacity:.88}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);font-size:18px;font-weight:900;box-shadow:0 8px 24px rgba(255,154,31,.35);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.busy{pointer-events:none;opacity:.75}
.cta.busy::after{content:"";width:18px;height:18px;border-radius:50%;border:3px solid rgba(26,18,6,.3);border-top-color:var(--ink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Tasdiqlash ===== */
.row{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.row>div{flex:1;min-width:0}
.row small{display:block;font-size:12px;color:var(--muted)}
.row b{display:block;margin-top:2px;font-size:17px;word-break:break-all}
.cp{color:var(--blue);padding:6px}
.meth{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:14px;border-radius:14px;border:1.5px solid var(--gold);background:rgba(255,200,61,.07)}
.meth .mi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,200,61,.18);font-size:20px}
.meth b{flex:1;font-size:16px}
.meth small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.chk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--ink)}
.total{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 14px;font-size:15px}
.total b{font-size:20px;color:var(--gold)}
.total s{color:var(--muted);font-size:14px;margin-right:6px}

/* ===== Muvaffaqiyat ===== */
.succ{text-align:center;padding-top:6px}
.sky{position:relative;height:200px;margin:0 -14px;overflow:hidden}
.para{position:absolute;top:8px;width:46px;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 0;opacity:.9}
.para.l{left:10%}.para.r{right:10%;top:30px;animation-delay:1.2s;width:38px}
@keyframes sway{50%{transform:rotate(7deg) translateY(6px)}}
.okring{position:absolute;left:50%;top:26px;width:130px;height:130px;margin-left:-65px}
.okring::before,.okring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(47,210,122,.55);animation:ring 2.4s ease-out infinite}
.okring::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.7);opacity:0}}
.okring svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(47,210,122,.7))}
.okring .c{stroke-dasharray:340;stroke-dashoffset:340;animation:draw .7s .1s ease forwards}
.okring .t{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .65s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.succ h1{margin:6px 0 8px;font-size:23px;line-height:1.2}
.succ p{margin:0 0 20px;color:var(--muted);font-size:15px}
.info{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:13px 14px;text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.info .ii{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(47,123,255,.18);color:#7fb0ff}
.info small{display:block;color:var(--muted);font-size:12px}
.info b{font-size:15px}
.succ .cta{margin-top:16px}

/* ===== Tarix ===== */
.chips{display:flex;gap:8px;margin:8px 0 14px;overflow-x:auto}
.chip{padding:9px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap}
.chip.on{background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);border-color:transparent}
.ord{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);animation:rise .45s ease backwards;animation-delay:calc(var(--i) * 55ms)}
.ord img{width:62px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.ord .m{flex:1;min-width:0}
.ord .m b{display:block;font-size:17px}
.ord .m span{display:block;margin-top:2px;color:var(--gold);font-weight:700;font-size:14px}
.ord .m small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}
.ord .r{text-align:right}
.ord .r small{display:block;margin-top:6px;color:var(--muted);font-size:11px;white-space:nowrap}
.st{display:inline-block;padding:4px 11px;border-radius:9px;font-size:12px;font-weight:800}
.st.pending{background:rgba(47,123,255,.2);color:#6fa6ff}
.st.done{background:rgba(47,210,122,.2);color:var(--green)}
.st.cancelled{background:rgba(135,147,184,.2);color:var(--gray)}
.empty{padding:50px 10px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}
.empty i{display:block;font-style:normal;font-size:44px;margin-bottom:6px}
.sk{height:78px;margin-bottom:10px;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.2s infinite linear}
@keyframes shim{to{background-position:-200% 0}}

/* ===== Qo'llab-quvvatlash ===== */
.sup{text-align:center}
.supart{position:relative;height:190px;margin:0 -14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(60% 70% at 50% 45%,rgba(47,123,255,.4),transparent 70%)}
.supart .hd{position:relative;width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c3fa8,#0b1a55);border:2px solid rgba(100,150,255,.6);color:#fff;box-shadow:0 0 36px rgba(47,123,255,.55)}
.supart .hd::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px dashed rgba(100,150,255,.45);animation:spin 14s linear infinite}
.sup h1{margin:6px 0 6px;font-size:23px}
.sup p{margin:0 0 18px;color:var(--muted);font-size:15px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:10px;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:800}
.sbtn.main{background:linear-gradient(90deg,#1f6bff,#2f8bff);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(47,123,255,.4)}
.sbtn:active{transform:scale(.98)}
.rtime{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;padding:13px;border-radius:14px;border:1px solid rgba(255,200,61,.4);color:var(--gold);font-weight:800}
.rtime span{color:var(--text);font-weight:600}

/* ===== Profil ===== */
.prof{text-align:center;padding-top:10px}
.ava{position:relative;width:96px;height:96px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1c3fa8,#0b1a55);border:2px solid rgba(100,150,255,.7);box-shadow:0 0 28px rgba(47,123,255,.5)}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof h2{margin:0;font-size:21px}
.prof .un{margin:3px 0 18px;color:var(--muted);font-size:14px}
.card{margin-bottom:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;text-align:left}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;font-size:15px;border-bottom:1px solid rgba(100,140,255,.14)}
.it:last-child{border-bottom:0}
.it .l{width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(47,123,255,.16);color:#7fb0ff}
.it .t{flex:1;font-weight:600}
.it .v{color:var(--muted);font-weight:600}
.it .v.g{color:var(--gold);font-weight:800}
.it .ch{color:var(--muted)}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:14px;background:rgba(135,147,184,.4);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(20px)}

/* ===== Yangiliklar ===== */
.news{margin-bottom:12px;padding:16px;border-radius:18px;border:1px solid rgba(255,200,61,.45);background:linear-gradient(120deg,rgba(255,200,61,.16),var(--card));display:flex;gap:14px}
.news .gi{width:48px;height:48px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink)}
.news b{display:block;color:var(--gold);font-size:16px}
.news p{margin:5px 0 0;font-size:14px;line-height:1.45}

/* ===== Pastki menyu ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--topbg);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:-.1px;transition:color .2s,transform .2s}
.tab span{position:relative;display:flex;padding:4px 14px;border-radius:12px;transition:background .25s}
.tab.on{color:var(--blue)}
.tab.on span{background:rgba(47,123,255,.2);transform:translateY(-1px)}
.tab:active{transform:scale(.92)}

/* ===== Yon menyu ===== */
#ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,18,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
body.dr #ov{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(78vw,330px);display:flex;flex-direction:column;overflow-y:auto;background:linear-gradient(180deg,#101c4d,#070d26);border-right:1px solid var(--line);border-radius:0 26px 26px 0;box-shadow:14px 0 44px rgba(0,0,0,.55);transform:translateX(-106%);visibility:hidden;transition:transform .5s cubic-bezier(.22,1,.36,1),visibility 0s .5s}
[data-theme=light] #drawer{background:linear-gradient(180deg,#ffffff,#e6edff)}
body.dr #drawer{transform:none;visibility:visible;transition-delay:0s}
.dh{display:flex;align-items:center;gap:12px;padding:18px 14px 14px}
.dh>div{flex:1;min-width:0}
.dh b{display:block;font-size:17px}
.dh small{display:block;font-size:12px;color:var(--muted)}
.dnav{padding:6px 10px;flex:1}
.di{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:4px;padding:14px 12px;border-radius:14px;text-align:left;font-size:16px;font-weight:600;opacity:0;transform:translateX(-22px)}
body.dr .di{animation:dIn .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.12s + var(--i) * 60ms)}
@keyframes dIn{to{opacity:1;transform:none}}
.di span{flex:1}
.di .ch{color:var(--muted)}
.di.on{background:rgba(255,200,61,.12);color:var(--gold)}
.dban{position:relative;margin:10px 14px 18px;padding:16px 14px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#17358f,#0a1233)}

  <div class="pkgcard"><img src="uc.png" alt=""><div><b class="big">${n}</b><span class="gold">${priceHtml(s)}</span></div></div>
  <div class="row" style="margin-top:12px"><div><small>${L("pid")}</small><b>${esc(S.pid)}</b></div><button class="cp" data-act="copy" data-v="${esc(S.pid)}">${ic("copy", 22)}</button></div>
  <div class="row"><div><small>${L("nick")}</small><b>${esc(S.nick)}</b></div><button class="cp" data-act="copy" data-v="${esc(S.nick)}">${ic("copy", 22)}</button></div>
  <h2 class="sec">${L("method")}</h2>
  <div class="meth"><span class="mi">⭐</span><b>${L("stars")}<small>${L("stars_d")}</small></b><span class="chk">${ic("check", 16)}</span></div>
  <div class="total"><span>${L("total")}:</span><div>${d !== s ? `<s>⭐ ${s}</s>` : ""}<b>⭐ ${d}</b></div></div>
  <button class="cta" id="payBtn" data-act="pay">${L("pay")} ${ic("card", 22)}</button></section>`;
}
const PARA = `<svg class="para ${"{c}"}" viewBox="0 0 60 80" fill="none"><path d="M4 28C4 10 16 2 30 2s26 8 26 26c-6-5-12-5-18 0-5-5-11-5-16 0-6-5-12-5-18 0z" fill="#ffc83d" stroke="#ff9a1f" stroke-width="2"/><path d="M4 28L28 62M30 28v34M56 28L32 62" stroke="#9fb6ff" stroke-width="1.5"/><rect x="24" y="60" width="12" height="12" rx="2" fill="#2f7bff"/></svg>`;
function vSuccess() {
  return `<section class="screen succ"><div class="sky">${PARA.replace("{c}", "l")}${PARA.replace("{c}", "r")}
  <div class="okring"><svg viewBox="0 0 120 120" fill="none"><circle class="c" cx="60" cy="60" r="54" stroke="#2fd27a" stroke-width="7" stroke-linecap="round" transform="rotate(-90 60 60)"/><polyline class="t" points="36,62 54,80 86,42" stroke="#2fd27a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  <h1>${L("s_t")}</h1><p>${L("s_d")}</p>
  <div class="info"><span class="ii">${ic("clip", 20)}</span><div><small>${L("s_no")}:</small><b id="ocode">${S.code || "…"}</b></div></div>
  <div class="info"><span class="ii">${ic("check", 20)}</span><div>${L("s_note")}</div></div>
  <button class="cta" data-act="nav" data-to="home">${ic("home", 22)} ${L("to_home")}</button></section>`;
}
function vOrders() {
  const f = S.filter;
  const chips = ["all", "pending", "done"].map(k => `<button class="chip${f === k ? " on" : ""}" data-act="filter" data-f="${k}">${L("f_" + k)}</button>`).join("");
  let body;
  if (S.orders === null && !S.ordErr) body = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  else if (S.ordErr) body = `<div class="empty"><i>⚠️</i>${L("o_err")}</div>`;
  else {
    const list = S.orders.filter(o => f === "all" || o.st === f);
    body = list.length ? list.map((o, i) => { const it = (SHOP[o.g] || {items: {}}).items[o.i] || [o.i, o.s];
      return `<div class="ord" style="--i:${Math.min(i, 8)}"><img src="uc.png" alt=""><div class="m"><b>${esc(it[0])}</b><span>⭐ ${o.s}</span><small>${esc(o.c || "")}</small></div>
      <div class="r"><span class="st ${o.st}">${L("st_" + o.st)}</span><small>${fmtDate(o.t)}</small></div></div>`; }).join("")
      : `<div class="empty"><i>🛒</i>${L("o_empty")}</div>`;
  }
  return `<section class="screen"><div class="chips">${chips}</div>${body}</section>`;
}
function vSupport() {
  return `<section class="screen sup"><div class="supart"><div class="hd">${ic("head", 54)}</div></div>
  <h1>${L("sup_h")}</h1><p>${L("sup_d")}</p>
  <button class="sbtn main" data-act="chatopen">${ic("send", 22)} @${SUPPORT}</button>
  <button class="sbtn" data-act="chatopen">${ic("chat", 22)} ${L("sup_chat")}</button>
  ${CHANNEL ? `<button class="sbtn" data-act="chanopen">${ic("send", 22)} ${L("sup_ch")}</button>` : ""}
  <div class="rtime">${ic("zap", 20)}<span>${L("sup_time")}</span> 24/7</div></section>`;
}
function vProfile() {
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const name = [u.first_name, u.last_name].filter(Boolean).join(" ") || "—";
  const ini = ((u.first_name || "?")[0] + ((u.last_name || "")[0] || "")).toUpperCase();
  const on = me ? me.notify : true;
  return `<section class="screen prof"><div class="ava">${esc(ini)}${u.photo_url ? `<img src="${esc(u.photo_url)}" alt="" onerror="this.remove()">` : ""}</div>
  <h2>${esc(name)}</h2><div class="un">${u.username ? "@" + esc(u.username) : ""}</div>
  <div class="card"><button class="it" data-act="copy" data-v="${u.id || ""}"><span class="l">${ic("user", 18)}</span><span class="t">ID: ${u.id || "—"}</span>${ic("copy", 18)}</button>
    <div class="it"><span class="l">${ic("clip", 18)}</span><span class="t">${L("p_orders")}:</span><span class="v">${me ? me.orders : "—"}</span></div>
    <div class="it"><span class="l">⭐</span><span class="t">${L("p_spent")}:</span><span class="v g">${me ? "⭐ " + me.spent : "—"}</span></div></div>
  <div class="card" id="settings"><div class="it"><span class="l">${ic("bell", 18)}</span><span class="t">${L("p_notif")}</span><button class="sw${on ? " on" : ""}" data-act="notif" aria-label="notif"></button></div>
    <button class="it" data-act="shlang"><span class="l">${ic("globe", 18)}</span><span class="t">${L("p_lang")}</span><span class="v">${lang === "ru" ? "Русский" : "O'zbek"}</span>${ic("chev", 18)}</button>
    <button class="it" data-act="shtheme"><span class="l">${ic(theme === "dark" ? "moon" : "sun", 18)}</span><span class="t">${L("p_theme")}</span><span class="v">${L(theme === "dark" ? "th_dark" : "th_light")}</span>${ic("chev", 18)}</button>
    <button class="it" data-act="logout"><span class="l">${ic("out", 18)}</span><span class="t">${L("p_out")}</span></button></div></section>`;
}
function vNews() {
  const p = me && me.discount ? me.discount.pct : 0, el = disc();
  return `<section class="screen"><div class="news"><span class="gi">${ic("gift", 26)}</span><div><b>${L("promo_t")}</b><p>${el ? L("n_promo", {p}) : (p ? L("n_used") : L("n_none"))}</p></div></div>
  ${CHANNEL ? `<button class="sbtn" data-act="chanopen">${ic("send", 22)} ${L("sup_ch")}</button>` : ""}</section>`;
}
const VIEWS = {home: vHome, form: vForm, confirm: vConfirm, success: vSuccess, orders: vOrders, support: vSupport, profile: vProfile, news: vNews};
const TITLES = {form: "order", confirm: "confirm", orders: "orders", support: "support", profile: "profile", news: "news", success: "order"};
const TABMAP = {home: "home", form: "home", news: "home", orders: "orders", support: "support", profile: "profile"};

// ===== Chizish =====
function render() {
  const sc = S.screen;
  $("#app").classList.toggle("no-tabs", sc === "confirm" || sc === "success");
  $("#top").innerHTML = (sc === "home" || sc === "success"
    ? `${LOGO}<div class="brand"><b>YAQUB UC SHOP</b><small>${L("sub")}</small></div>`
    : `<button class="rb" data-act="back">${ic("back", 22)}</button><div class="ttl">${L(TITLES[sc])}</div>`)
    + `<button class="rb" data-act="dopen">${ic("dots", 22)}</button>`;
  $("#view").innerHTML = (VIEWS[sc] || vHome)();
  $("#tabs").innerHTML = [["home", "home"], ["orders", "clip"], ["support", "head"], ["profile", "user"]].map(([k, i]) =>
    `<button class="tab${TABMAP[sc] === k ? " on" : ""}" data-act="nav" data-to="${k}"><span>${ic(i, 24)}</span>${L("tab_" + k)}</button>`).join("");
  renderDrawer();
  try { sc === "home" ? tg.BackButton.hide() : tg.BackButton.show(); } catch (e) {}
}
function renderDrawer() {
  const cur = S.screen === "home" || S.screen === "form" ? "home" : S.screen;
  const items = [["home", "home", "m_home"], ["pick", "grid", "m_pick"], ["orders", "clip", "m_orders"], ["support", "head", "m_support"], ["profile", "user", "m_profile"], ["news", "gift", "m_news"], ["settings", "sliders", "m_set"]];
  $("#drawer").innerHTML = `<div class="dh">${LOGO}<div><b>YAQUB UC SHOP</b><small>Premium Game Store</small></div><button class="rb" data-act="dclose">${ic("x", 20)}</button></div>
  <nav class="dnav">${items.map(([to, i, k], n) => `<button class="di${cur === to ? " on" : ""}" style="--i:${n}" data-act="nav" data-to="${to}">${ic(i, 22)}<span>${L(k)}</span><i class="ch">${ic("chev", 18)}</i></button>`).join("")}</nav>
  <div class="dban"><b>YAQUB UC SHOP</b><small>${L("banner")}</small><span class="pl">${ic("send", 20)}</span></div>`;
}
function openDrawer() { document.body.classList.add("dr", "lock"); hap(); }
function closeDrawer() { document.body.classList.remove("dr", "lock"); }
function openSheet(title, rows) {
  $("#sheet").innerHTML = `<div class="bg" data-act="sclose"></div><div class="pn"><h3>${title}</h3>${rows.map(r => `<button class="so${r.on ? " on" : ""}" data-act="${r.act}" data-v="${r.v}">${r.ic}<span>${r.t}</span>${r.on ? `<b class="k">${ic("check", 20)}</b>` : ""}</button>`).join("")}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $("#sheet").classList.add("on")));
}
function closeSheet() { $("#sheet").classList.remove("on"); }

// ===== Navigatsiya =====
function enter(s) {
  if (s === "orders") loadOrders();
  if (s === "profile") loadMe();
}
function nav(to, push) {
  closeDrawer(); closeSheet();
  if (to === "pick") { S.stack = []; S.screen = "home"; render(); setTimeout(() => { const e = $("#picks"); e && e.scrollIntoView({behavior: "smooth", block: "start"}); }, 60); return; }
  if (to === "settings") { S.stack = []; S.screen = "profile"; render(); enter("profile"); setTimeout(() => { const e = $("#settings"); e && e.scrollIntoView({behavior: "smooth", block: "center"}); }, 80); return; }
  if (push) S.stack.push(S.screen); else S.stack = [];
  S.screen = to; window.scrollTo(0, 0); render(); enter(to);
}
function back() {
  if (document.body.classList.contains("dr")) return closeDrawer();
  if ($("#sheet").classList.contains("on")) return closeSheet();
  if (S.stack.length) S.screen = S.stack.pop(); else S.screen = "home";
  window.scrollTo(0, 0); render(); enter(S.screen);
}

// ===== Ma'lumot yuklash =====
async function loadMe() {
  try {
    me = await api("/api/me");
    if (!LS.get("lang") && me.lang && I18N[me.lang]) lang = me.lang;
  } catch (e) { return; }
  if (["home", "profile", "news"].includes(S.screen)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
async function loadOrders() {
  S.orders = null; S.ordErr = false; render();
  try { S.orders = (await api("/api/orders")).orders; } catch (e) { S.ordErr = true; }
  if (S.screen === "orders") render();
}
async function pollOrder(id) {
  for (let i = 0; i < 12; i++) {
    try { const r = await api("/api/order/" + id); if (r.code) { S.code = r.code; const e = $("#ocode"); if (e) e.textContent = r.code; return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 800));
  }
}

// ===== Harakatlar =====
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const c = theme === "dark" ? "#050a1e" : "#eef2fc";
  try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
  try { tg.setBottomBarColor(c); } catch (e) {}
}
function mark(id, msg) { const f = $(id); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); const i = f.querySelector("input"); i && i.focus(); toast(msg); note("error"); }
async function pay() {
  if (S.busy) return;
  const b = $("#payBtn"); S.busy = true; b && b.classList.add("busy");
  const end = () => { S.busy = false; const x = $("#payBtn"); x && x.classList.remove("busy"); };
  try {
    const r = await api("/api/invoice", {g: "pubg", i: S.pkg, p: S.pid, n: S.nick});
    S.oid = r.id;
    tg.openInvoice(r.link, st => {
      end();
      if (st === "paid") { note("success"); S.code = ""; S.stack = []; S.screen = "success"; window.scrollTo(0, 0); render(); pollOrder(r.id); loadMe(); }
      else if (st === "failed") alertMsg(L("pay_fail"));
      else if (st === "cancelled") toast(L("pay_cancel"));
    });
  } catch (e) { end(); alertMsg(L("pay_err")); }
}
function setLang(l) {
  lang = l; LS.set("lang", l); api("/api/settings", {lang: l}).catch(() => {});
  closeSheet(); render();
}
const ACT = {
  nav: el => nav(el.dataset.to), back, dopen: openDrawer, dclose: closeDrawer, sclose: closeSheet,
  pick: el => { S.pkg = el.dataset.k; hap(); nav("form", true); },
  help: () => toast(L("help")),
  cont: () => {
    S.pid = ($("#pid").value || "").trim(); S.nick = ($("#nick").value || "").replace(/\s+/g, " ").trim();
    if (!okPid(S.pid)) return mark("#f-pid", L("e_pid"));
    if (!okNick(S.nick)) return mark("#f-nick", L("e_nick"));
    LS.set("pid", S.pid); LS.set("nick", S.nick); hap(); nav("confirm", true);
  },
  copy: el => el.dataset.v && copy(el.dataset.v),
  pay,
  filter: el => { S.filter = el.dataset.f; hap(); render(); },
  chatopen: () => { hap(); const u = "https://t.me/" + SUPPORT; try { tg.openTelegramLink(u); } catch (e) { location.href = u; } },
  chanopen: () => { hap(); const u = "https://t.me/" + CHANNEL; try { tg.openTelegramLink(u); } catch (e) { location.href = u; } },
  notif: el => { const v = !(me ? me.notify : true); if (me) me.notify = v; el.classList.toggle("on", v); hap(); api("/api/settings", {notify: v}).catch(() => { if (me) me.notify = !v; el.classList.toggle("on", !v); }); },
  shlang: () => openSheet(L("sh_lang"), [{act: "setlang", v: "uz", t: "O'zbekcha", ic: "🇺🇿", on: lang === "uz"}, {act: "setlang", v: "ru", t: "Русский", ic: "🇷🇺", on: lang === "ru"}]),
  setlang: el => setLang(el.dataset.v),
  shtheme: () => openSheet(L("sh_theme"), [{act: "settheme", v: "dark", t: L("th_dark"), ic: ic("moon", 22), on: theme === "dark"}, {act: "settheme", v: "light", t: L("th_light"), ic: ic("sun", 22), on: theme === "light"}]),
  settheme: el => { theme = el.dataset.v; LS.set("theme", theme); applyTheme(); closeSheet(); render(); },
  logout: () => { try { tg.showConfirm(L("out_q"), ok => ok && tg.close()); } catch (e) {} }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener("input", e => {
  if (e.target.id === "pid") { e.target.value = e.target.value.replace(/\D/g, ""); S.pid = e.target.value; e.target.closest(".fld").classList.remove("bad"); }
  if (e.target.id === "nick") { S.nick = e.target.value.replace(/[\r\n\t]+/g, " "); e.target.closest(".fld").classList.remove("bad"); }
});

// ===== Boshlash =====
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.MainButton.hide(); } catch (e) {}
  try { tg.BackButton.onClick(back); } catch (e) {}
}
applyTheme(); render(); loadMe();
</script>
</body>
</html>
